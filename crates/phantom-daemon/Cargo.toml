[package]
name = "phantom-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Daemon for phantom TUI automation"
keywords = ["tui", "terminal", "testing", "automation", "ghostty"]
categories = ["development-tools::testing"]

[[bin]]
name = "phantom-daemon"
path = "src/main.rs"

[features]
default = ["ghostty"]
# Terminal emulation via libghostty-vt. Requires Zig 0.15.x to build.
ghostty = ["dep:libghostty-vt"]

[dependencies]
phantom-core.workspace = true
libghostty-vt = { version = "0.2", optional = true }
clap.workspace = true
nix.workspace = true
mio.workspace = true
crossbeam-channel.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
regex.workspace = true
