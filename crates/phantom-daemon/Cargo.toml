[package]
name = "phantom-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Daemon for phantom TUI automation"
keywords = ["tui", "terminal", "testing", "automation", "ghostty"]
categories = ["development-tools::testing"]

[[bin]]
name = "phantom-daemon"
path = "src/main.rs"

[features]
default = ["ghostty"]
# Terminal emulation via libghostty-vt. Requires Zig 0.15.x to build.
ghostty = ["dep:libghostty-vt"]
# Pure-Rust terminal emulation, no Zig toolchain needed. alacritty_terminal
# has no key encoder, so termwiz supplies one.
alacritty = ["dep:alacritty_terminal", "dep:termwiz"]

[dependencies]
phantom-core.workspace = true
libghostty-vt = { version = "0.2", optional = true }
clap.workspace = true
nix.workspace = true
mio.workspace = true
crossbeam-channel.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# default-features = false drops serde; we never serialize its types.
alacritty_terminal = { version = "0.26.0", default-features = false, optional = true }
termwiz = { version = "0.23.3", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"
regex.workspace = true
