name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: "0.15.2"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to macos-14: the macos-latest image (Xcode 17+ SDK) fails to
          # link zig 0.15.2's compiler_rt (undefined symbol
          # __availability_version_check). macos-14 keeps a compatible SDK, and
          # ghostty pins minimum_zig_version = 0.15.2 so we can't just bump zig.
          - os: macos-14
            zig-arch: aarch64-macos
          - os: ubuntu-latest
            zig-arch: x86_64-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        run: |
          curl -L -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-${{ matrix.zig-arch }}-${ZIG_VERSION}.tar.xz"
          tar xf zig.tar.xz
          echo "$PWD/zig-${{ matrix.zig-arch }}-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test -p phantom-daemon -- --test-threads=1

      # Features are additive, so both backends can be on at once. ghostty is
      # supposed to win; this checks that the selection still compiles and
      # still picks ghostty.
      - name: Check both backends enabled
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p phantom-daemon --features alacritty --lib

  alacritty:
    name: Check (pure-Rust backend)
    runs-on: ubuntu-latest
    # Deliberately no Zig install: the point of this backend is that it builds
    # without one, and a missing toolchain here is what proves it.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -p phantom-daemon --no-default-features --features alacritty --all-targets -- -D warnings

      - name: Run tests
        run: cargo test -p phantom-daemon --no-default-features --features alacritty -- --test-threads=1
